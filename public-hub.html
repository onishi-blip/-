<head>

<title>自己理解フィールドガイド | コンテンツ一覧</title>
<style>
  :root {
    --paper: #f8faf1;
    --card: #ffffff;
    --ink: #2b3327;
    --ink-soft: #6c7861;
    --line: #e0e6d2;
    --accent-h: 152;
    --accent: hsl(var(--accent-h) 48% 40%);
    --accent-contrast: #ffffff;
    --accent-soft: hsl(var(--accent-h) 55% 95%);
    --shadow: rgba(80, 95, 55, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b2114;
      --card: #242c1b;
      --ink: #f1f4e6;
      --ink-soft: #b3bda2;
      --line: #3c4830;
      --accent: hsl(var(--accent-h) 48% 66%);
      --accent-contrast: #10140b;
      --accent-soft: hsl(var(--accent-h) 32% 24%);
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b2114;
    --card: #242c1b;
    --ink: #f1f4e6;
    --ink-soft: #b3bda2;
    --line: #3c4830;
    --accent: hsl(var(--accent-h) 48% 66%);
    --accent-contrast: #10140b;
    --accent-soft: hsl(var(--accent-h) 32% 24%);
    --shadow: rgba(0, 0, 0, 0.4);
  }
  :root[data-theme="light"] {
    --paper: #f8faf1;
    --card: #ffffff;
    --ink: #2b3327;
    --ink-soft: #6c7861;
    --line: #e0e6d2;
    --accent: hsl(var(--accent-h) 48% 40%);
    --accent-contrast: #ffffff;
    --accent-soft: hsl(var(--accent-h) 55% 95%);
    --shadow: rgba(80, 95, 55, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 20px 64px;
  }
  .purpose-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 8px 15px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-contrast);
    margin-bottom: 18px;
    box-shadow: 0 8px 18px -10px var(--shadow);
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 14px;
  }
  .eyebrow::before {
    content: "";
    width: 16px;
    height: 1px;
    background: var(--accent);
    display: inline-block;
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    font-weight: 600;
    font-size: 1.9rem;
    line-height: 1.5;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  .lead {
    line-height: 1.9;
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0 0 40px;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  a.item-card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 26px var(--shadow);
    padding: 24px 22px;
    text-decoration: none;
    color: var(--ink);
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.item-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: var(--accent);
  }
  a.item-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 34px var(--shadow);
  }
  a.item-card:active { transform: translateY(-1px); }
  a.item-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .item-icon {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent-soft);
    border: 3px solid var(--accent);
    box-shadow: 0 0 0 5px var(--accent-soft);
  }
  .item-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .item-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    font-weight: 700;
    font-size: 1.12rem;
  }
  .item-tag {
    font-size: 0.66rem;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .item-desc {
    font-size: 0.86rem;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0;
  }
  .item-arrow {
    flex-shrink: 0;
    color: var(--ink-soft);
    font-size: 1.2rem;
    align-self: center;
  }
  .footer-note {
    text-align: center;
    font-size: 0.7rem;
    color: var(--ink-soft);
    margin-top: 36px;
    letter-spacing: 0.02em;
  }
</style>
</head>
